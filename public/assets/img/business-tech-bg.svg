<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" fill="none">
  <defs>
    <!-- Dot Pattern for Engineering Matrix (Clean White, No Gradients) -->
    <pattern id="techDotGridWhite" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="1.1" fill="#ffffff" fill-opacity="0.07" />
    </pattern>
  </defs>

  <!-- 1. Dot Matrix Pattern (Subtle digital blueprint background) -->
  <rect width="1600" height="900" fill="url(#techDotGridWhite)" />

  <!-- 2. Architectural Network & System Flow Lines (Right Side & Center, Clean White Solid) -->
  <path d="M 980 120 L 1240 120 C 1320 120, 1360 160, 1360 240 L 1360 480 C 1360 560, 1400 600, 1480 600 L 1620 600" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.14" />
  <path d="M 850 180 L 1150 180 C 1220 180, 1260 220, 1260 290 L 1260 520 C 1260 580, 1300 620, 1360 620 L 1550 620" stroke="#ffffff" stroke-width="1" stroke-opacity="0.09" />

  <!-- Secondary flow line (Lower left to center) -->
  <path d="M -20 680 L 260 680 C 340 680, 380 640, 380 560 L 380 420 C 380 340, 420 300, 500 300 L 740 300" stroke="#ffffff" stroke-width="1" stroke-opacity="0.10" />

  <!-- 3. System Node Junctions & Concentric Rings (Solid White) -->
  <!-- Upper Right Cluster (Cloud / API Node) -->
  <circle cx="1240" cy="120" r="4" fill="#ffffff" fill-opacity="0.55" />
  <circle cx="1240" cy="120" r="14" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.22" />
  
  <circle cx="1360" cy="360" r="3.5" fill="#ffffff" fill-opacity="0.45" />
  
  <circle cx="1480" cy="600" r="4" fill="#ffffff" fill-opacity="0.55" />
  <circle cx="1480" cy="600" r="16" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.20" />

  <!-- Left Cluster (Data / Client Node) -->
  <circle cx="260" cy="680" r="3.5" fill="#ffffff" fill-opacity="0.45" />
  <circle cx="380" cy="490" r="3" fill="#ffffff" fill-opacity="0.35" />
  <circle cx="500" cy="300" r="3.5" fill="#ffffff" fill-opacity="0.45" />
  <circle cx="500" cy="300" r="12" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.20" />

  <!-- 4. Technical Coordinate Crosshairs (+) -->
  <path d="M 160 160 L 160 176 M 152 168 L 168 168" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.28" />
  <path d="M 820 80 L 820 96 M 812 88 L 828 88" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.22" />
  <path d="M 1440 260 L 1440 276 M 1432 268 L 1448 268" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.25" />
  <path d="M 720 780 L 720 796 M 712 788 L 728 788" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.22" />

  <!-- 5. Architectural Guide Lines -->
  <line x1="80" y1="450" x2="600" y2="450" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.08" />
  <line x1="1100" y1="720" x2="1520" y2="720" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.08" />
</svg>
