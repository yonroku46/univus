<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft Luminous Atmosphere (Fresh Cyan & Primary Blue Glow) -->
    <radialGradient id="heroAtmosphere" cx="72%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14" />
      <stop offset="40%" stop-color="#2181d3" stop-opacity="0.06" />
      <stop offset="75%" stop-color="#2181d3" stop-opacity="0.015" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients for Sweeping Orbits -->
    <linearGradient id="orbitGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#2181d3" stop-opacity="0.06" />
    </linearGradient>

    <linearGradient id="orbitGradCyan" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#2181d3" stop-opacity="0.03" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2181d3" stop-opacity="0.02" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.20" />
      <stop offset="75%" stop-color="#0ea5e9" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#2181d3" stop-opacity="0.03" />
    </linearGradient>
  </defs>

  <!-- 1. Ambient Fresh Luminous Glow -->
  <rect width="1600" height="800" fill="url(#heroAtmosphere)" />

  <!-- 2. Sweeping Geometric Orbital Rings (Anchored behind visual at cx=1160, cy=380) -->
  <circle cx="1160" cy="380" r="160" stroke="url(#orbitGradPrimary)" stroke-width="1.2" />
  <circle cx="1160" cy="380" r="280" stroke="url(#orbitGradPrimary)" stroke-width="1.2" />
  <circle cx="1160" cy="380" r="440" stroke="url(#orbitGradCyan)" stroke-width="1.2" />
  <circle cx="1160" cy="380" r="640" stroke="url(#orbitGradCyan)" stroke-width="1" />
  <circle cx="1160" cy="380" r="880" stroke="url(#orbitGradCyan)" stroke-width="0.8" />
  <circle cx="1160" cy="380" r="1160" stroke="url(#orbitGradCyan)" stroke-width="0.6" />

  <!-- 3. Dynamic Horizon Breeze Curves (Sweeping across from bottom-left to top-right) -->
  <path d="M -50 720 C 400 720, 850 560, 1160 380 C 1380 250, 1520 120, 1680 -20" stroke="url(#waveGrad)" stroke-width="1.2" />
  <path d="M -50 800 C 480 800, 920 620, 1260 380 C 1460 210, 1560 100, 1680 40" stroke="url(#waveGrad)" stroke-width="1" />
  <path d="M 200 850 C 650 780, 1050 540, 1360 380 C 1520 280, 1600 200, 1680 140" stroke="url(#waveGrad)" stroke-width="0.75" />

  <!-- 4. Delicate Tangent Axis Lines -->
  <line x1="1160" y1="40" x2="1160" y2="720" stroke="#0ea5e9" stroke-width="0.75" stroke-opacity="0.10" />
  <line x1="280" y1="380" x2="1600" y2="380" stroke="#0ea5e9" stroke-width="0.75" stroke-opacity="0.10" />

  <!-- 5. Geometric Coordinate Crosshairs (+) -->
  <!-- Top Left -->
  <path d="M 180 140 L 180 156 M 172 148 L 188 148" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.30" />
  <!-- Center Top -->
  <path d="M 720 100 L 720 116 M 712 108 L 728 108" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.30" />
  <!-- Bottom Left -->
  <path d="M 520 640 L 520 656 M 512 648 L 528 648" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.25" />
  <!-- Top Right -->
  <path d="M 1480 120 L 1480 136 M 1472 128 L 1488 128" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.25" />

  <!-- 6. Satellite Node Accents on Orbital Intersections -->
  <circle cx="1000" cy="380" r="3.5" fill="#38bdf8" fill-opacity="0.65" />
  <circle cx="1160" cy="220" r="3" fill="#2181d3" fill-opacity="0.60" />
  <circle cx="1440" cy="380" r="3.5" fill="#0ea5e9" fill-opacity="0.55" />
  <circle cx="720" cy="380" r="3" fill="#38bdf8" fill-opacity="0.45" />
  <circle cx="1160" cy="660" r="2.5" fill="#2181d3" fill-opacity="0.40" />
</svg>
